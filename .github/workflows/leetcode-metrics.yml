
name: Update LeetCode Metrics

on:
  schedule:
    - cron: "0 4 * * *"

  push:
    branches:
      - main
    paths:
      - ".github/workflows/leetcode-metrics.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate LeetCode statistics
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          user: semenkulikov
          filename: leetcode-metrics.svg
          base: ""

          plugin_leetcode: yes
          plugin_leetcode_user: SemSai
          plugin_leetcode_sections: skills, recent
          plugin_leetcode_limit_skills: 4
          plugin_leetcode_limit_recent: 2

          output_action: commit
