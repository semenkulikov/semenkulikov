
name: Update Activity Graph

on:
  schedule:
    - cron: "0 4 * * *"

  push:
    branches:
      - main
    paths:
      - ".github/workflows/activity-graph.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: semenkulikov
          token: ${{ secrets.STREAK_STATS_TOKEN }}
          output_path: profile/activity-graph.svg
          options: >-
           bg_color=0d1117&color=c9d1d9&title_color=58a6ff&line=58a6ff&point=f0883e&area=true&area_color=1f6feb&border_color=30363d&radius=12&height=240&days=31&custom_title=Contribution%20Activity&grid=false


      - name: Add SVG animations
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          svg_path = Path("profile/activity-graph.svg")
          svg = svg_path.read_text(encoding="utf-8")

          line_pattern = (
              r'<(?:path|polyline)\b'
              r'[^>]*class=["\'][^"\']*\bct-line\b'
          )

          if not re.search(line_pattern, svg):
              raise SystemExit(
                  "Chartist .ct-line not found. "
                  "SVG structure may have changed."
              )

          svg_tag = re.search(r"<svg\b[^>]*>", svg)

          if svg_tag is None:
              raise SystemExit("SVG root element not found.")

          animation_css = """
          <style>
            @keyframes graph-line-draw {
              from { stroke-dashoffset: 5000; }
              to { stroke-dashoffset: 0; }
            }

            @keyframes graph-area-reveal {
              from { opacity: 0; }
              to { opacity: 0.20; }
            }

            @keyframes graph-points-reveal {
              from { opacity: 0; }
              to { opacity: 1; }
            }

            .ct-line {
              stroke-dasharray: 5000;
              stroke-dashoffset: 5000;
              stroke-linecap: round;
              animation: graph-line-draw
                2.3s cubic-bezier(.22,.61,.36,1)
                0.15s forwards;
            }

            .ct-area {
              opacity: 0;
              animation: graph-area-reveal
                1s ease-out 0.9s forwards;
            }

            .ct-point {
              opacity: 0;
              animation: graph-points-reveal
                0.4s ease-out 1.7s forwards;
            }

            @media (prefers-reduced-motion: reduce) {
              .ct-line {
                animation: none;
                stroke-dasharray: none;
                stroke-dashoffset: 0;
              }

              .ct-area {
                animation: none;
                opacity: 0.20;
              }

              .ct-point {
                animation: none;
                opacity: 1;
              }
            }
          </style>
          """

          svg = (
              svg[:svg_tag.end()]
              + animation_css
              + svg[svg_tag.end():]
          )

          svg_path.write_text(svg, encoding="utf-8")
          PY


      - name: Commit activity graph
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add profile/activity-graph.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: update activity graph"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Activity graph successfully pushed"
              exit 0
            fi

            echo "Push attempt ${attempt} failed. Retrying..."
            sleep 2
          done

          echo "Unable to push activity graph after 3 attempts"
          exit 1
