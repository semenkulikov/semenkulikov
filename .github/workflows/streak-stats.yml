name: Update streak stats

on:
  concurrency:
    group: streak-stats
    cancel-in-progress: false
  schedule:
    - cron: "0 3 * * *" # Run every day at 03:00
  push:
    paths:
      - ".github/workflows/streak-stats.yml" # Run any time this file is modified
  workflow_dispatch: # Run manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Generate streak stats
        uses: semenkulikov/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=dark&background=135,0d1117,161b22&border=30363d&stroke=30363d&ring=58a6ff&fire=f0883e&currStreakNum=ffffff&sideNums=c9d1d9&currStreakLabel=58a6ff&sideLabels=8b949e&dates=8b949e&border_radius=12&card_width=500&card_height=190&locale=en&timezone=Europe/Belgrade&disable_animations=false
          path: profile/streak.svg
          token: ${{ secrets.STREAK_STATS_TOKEN }}

      - name: Commit streak stats
        shell: bash
        run: |
          cp profile/streak.svg /tmp/streak.svg

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/streak.svg profile/streak.svg
            git add profile/streak.svg

            if git diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
            fi

            git commit -m "Update streak stats"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push attempt ${attempt} failed. Retrying..."
            sleep 3
          done

          echo "Unable to push after 3 attempts"
          exit 1
