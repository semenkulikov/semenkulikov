
    <svg
        width="1200"
        height="240"
        viewBox="0 0 1200 240"
        fill="none"
        xmlns="http://www.w3.org/2000/svg">
<style>
  @keyframes graph-line-draw {
    from { stroke-dashoffset: 5000; }
    to { stroke-dashoffset: 0; }
  }

  @keyframes graph-area-reveal {
    from { opacity: 0; }
    to { opacity: 0.20; }
  }

  @keyframes graph-points-reveal {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .ct-line {
    stroke-dasharray: 5000;
    stroke-dashoffset: 5000;
    stroke-linecap: round;
    animation: graph-line-draw
      2.3s cubic-bezier(.22,.61,.36,1)
      0.15s forwards;
  }

  .ct-area {
    opacity: 0;
    animation: graph-area-reveal
      1s ease-out 0.9s forwards;
  }

  .ct-point {
    opacity: 0;
    animation: graph-points-reveal
      0.4s ease-out 1.7s forwards;
  }

  @media (prefers-reduced-motion: reduce) {
    .ct-line {
      animation: none;
      stroke-dasharray: none;
      stroke-dashoffset: 0;
    }

    .ct-area {
      animation: none;
      opacity: 0.20;
    }

    .ct-point {
      animation: none;
      opacity: 1;
    }
  }
</style>

